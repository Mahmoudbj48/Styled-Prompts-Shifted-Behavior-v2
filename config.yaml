# Project Configuration
models:
  L3.2-3B: "meta-llama/Llama-3.2-3B-Instruct"
  L3.1-8B: "meta-llama/Llama-3.1-8B-Instruct"


  G-2B: "google/gemma-2b-it"
  G-7B: "google/gemma-7b-it"

  Q2.5-1.5B: "Qwen/Qwen2.5-1.5B-Instruct"
  Q2.5-7B: "Qwen/Qwen2.5-7B-Instruct"

  Q3.5-9B: "Qwen/Qwen3.5-9B"
  Q3.5-27B: "Qwen/Qwen3.5-27B"

  G4-26B: "google/gemma-4-26B-A4B-it"
  G4-E4B: "google/gemma-4-E4B-it"

datasets:
  truthful_qa:
    config_name: "generation"
    split: "validation"
    sample_size: 128

  gsm8k:
    config_name: "main"
    split: "test"
    sample_size: 128

  natural_questions:
    config_name: "default"
    split: "validation"
    sample_size: 128

  alpaca:
    repo_id: "tatsu-lab/alpaca"
    split: "train"
    sample_size: 128

  simpleqa_verified:
    repo_id: "google/simpleqa-verified"
    split: "test"
    sample_size: 128

  trivia_qa:
    repo_id: "mandarjoshi/trivia_qa"
    config_name: "rc"
    split: "validation"
    sample_size: 128

  hotpot_qa:
    repo_id: "hotpotqa/hotpot_qa"
    config_name: "distractor"
    split: "validation"
    sample_size: 128

  harmbench:
    repo_id: "walledai/HarmBench"
    config_name: "standard"
    split: null  # Will auto-select
    sample_size: 128

defaults:
  max_new_tokens: 100
  max_new_tokens_cot: 150
  device_map: "auto"
  dtype: "float16"
  random_seed: 42

style_levels:
  spacing: [0, 1, 5, 20, 50, 100]
  punctuation: [0, 1, 3, 5, 10, 20]
  letter_case : [0,10, 25, 50, 75, 100]
  politeness: [-10,-8,-6,-4,-2,0, 2, 4,6,8,10]
  inter_vs_imper: ["interrogative", "imperative"]
  length_variation: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0]

safety_models:
  llamaguard3: meta-llama/Llama-Guard-3-8B



style_positions:
  spacing: ["prefix","suffix", "global"]
  punctuation: ["prefix", "suffix", "global"]
  letter_case: ["prefix", "suffix", "global"]
  politeness: ["prefix", "suffix", "global"]
  length_variation: ["global"]
  inter_vs_imper: ["global"]
style_defaults:
  politeness:
    strength_range: [-10, 10]
    strength_step: 2
    positions: ["prefix", "suffix", "global"]

mirroring_defaults:
  judge_provider: "openai"
  judge_model: "gpt-4o-mini"
  judge_max_output_tokens: 16
  max_judge_calls: 200000